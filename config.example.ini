[app]
# Rutas relativas se interpretan desde la raíz del proyecto.
database = tasks.db
timezone = America/Santiago
port = 8000
# Usado por Gunicorn en producción; el servidor local usa port.
socket = /run/flujo/flujo.sock
# false: solo el administrador puede agregar usuarios tras crear la primera cuenta.
allow_self_registration = false

# Integración Slack (requiere soporte Slack en la aplicación).
[slack]
client_id =
client_secret =
base_url = https://tareas.ejemplo.com
